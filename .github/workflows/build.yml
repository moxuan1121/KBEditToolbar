name: Build tweak (roothide)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-roothide:
    runs-on: macos-14
    name: build-roothide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Install ldid (dylib signer)
        run: |
          brew install ldid || brew install ldid-procursus || true
          command -v ldid || { echo "ldid still missing"; exit 1; }

      - name: Install Theos (roothide)
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Ensure iOS SDK present
        run: |
          export THEOS=$HOME/theos
          if ! ls "$THEOS"/sdks/iPhoneOS*.sdk >/dev/null 2>&1; then
            echo "No iPhoneOS SDK in theos; fetching it now…"
            rm -rf /tmp/theos-sdks
            git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
            mkdir -p "$THEOS/sdks"
            cp -R /tmp/theos-sdks/iPhoneOS*.sdk "$THEOS/sdks"/ 2>/dev/null || \
              cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks"/ 2>/dev/null || true
          fi
          ls -d "$THEOS"/sdks/*.sdk 2>/dev/null || { echo "NO SDK"; exit 1; }

      - name: Build roothide package
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide package

      - name: Upload roothide .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBEditToolbar-roothide-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Attach .deb to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
