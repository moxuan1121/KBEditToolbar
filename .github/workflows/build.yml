name: Build tweak (rootless + roothide)

# Builds the tweak into installable .deb packages on a macOS runner.
# Two variants via a matrix:
#   - rootless : standard theos (theos/theos)   -> for rootless jailbreaks
#   - roothide : roothide theos (roothide/theos) -> for Dopamine RootHide
# No local WSL/Theos needed — push to GitHub, then download the .deb from
# the run's Artifacts (or from the auto-created Release on a tag).

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:      # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: macos-14     # Xcode 15.x, arm64e-capable toolchain
    strategy:
      fail-fast: false     # one variant failing must not cancel the other
      matrix:
        include:
          - scheme: rootless
            theos_repo: https://github.com/theos/theos.git
          - scheme: roothide
            theos_repo: https://github.com/roothide/theos.git
    name: build-${{ matrix.scheme }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Install Theos (${{ matrix.scheme }})
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          # Recursive clone of the matching theos fork (submodules incl. lib/headers).
          git clone --recursive "${{ matrix.theos_repo }}" "$THEOS"

      - name: Ensure iOS SDK present
        run: |
          export THEOS=$HOME/theos
          if ! ls "$THEOS"/sdks/iPhoneOS*.sdk >/dev/null 2>&1; then
            echo "No iPhoneOS SDK in theos; fetching into a temp dir and copying in…"
            rm -rf /tmp/theos-sdks
            git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
            mkdir -p "$THEOS/sdks"
            # copy into the existing (non-empty) sdks dir to avoid clone conflicts
            cp -R /tmp/theos-sdks/iPhoneOS*.sdk "$THEOS/sdks"/ 2>/dev/null || \
              cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks"/ 2>/dev/null || true
          fi
          echo "=== SDKs available ==="
          ls -d "$THEOS"/sdks/*.sdk 2>/dev/null || { echo "STILL NO SDK"; exit 1; }

      - name: Build (FINALPACKAGE, ${{ matrix.scheme }})
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBEditToolbar-${{ matrix.scheme }}-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Attach .deb to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
